name: mlops-ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Unit tests
        run: python -m pytest -q --junitxml=reports/test-results.xml
      - name: Download official data
        run: python -m scripts.fetch_data
      - name: Generate and track EDA
        run: python -m scripts.eda
      - name: Train and track models
        run: python -m scripts.train --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlops-run-outputs
          path: |
            artifacts/
            reports/figures/
            reports/test-results.xml
            reports/descriptive_statistics.csv
            reports/missing_values.csv
            mlruns/
          if-no-files-found: ignore
